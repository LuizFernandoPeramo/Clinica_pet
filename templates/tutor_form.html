{% extends 'base.html' %}
{% block title %}{{ 'Editar' if antigo else 'Novo' }} tutor | {{ config.NOME_SISTEMA }}{% endblock %}
{% block content %}
<section class="panel narrow">
    <h1>{{ 'Editar' if antigo else 'Novo' }} tutor</h1>
    <form method="post">
        <label for="nome">Nome
            <input id="nome" name="nome" value="{{ request.form.get('nome', antigo.nome if antigo else '') }}" maxlength="100" autocomplete="name" required>
        </label>
        <label for="cpf">CPF
            <input id="cpf" name="cpf" value="{{ request.form.get('cpf', '') }}" minlength="11" maxlength="14" inputmode="numeric" aria-describedby="cpf-ajuda" {% if not antigo %}required{% endif %}>
            <small id="cpf-ajuda" class="field-help">{{ 'Deixe em branco para manter o CPF atual.' if antigo else 'Informe os 11 números, com ou sem pontuação.' }}</small>
        </label>
        <label for="email">E-mail
            <input id="email" type="email" name="email" value="{{ request.form.get('email', antigo.email if antigo else '') }}" maxlength="120" autocomplete="email" required>
        </label>
        <label for="telefone">Telefone
            <input id="telefone" type="tel" name="telefone" value="{{ request.form.get('telefone', antigo.telefone or '' if antigo else '') }}" maxlength="20" autocomplete="tel">
        </label>
        <div class="form-actions">
            <button type="submit">Salvar</button>
            <a class="btn secondary" href="{{ url_for('listar_tutores') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
